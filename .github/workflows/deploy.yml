name: Deploy Intelligent Document Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger from GitHub UI

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.9.5

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          pip install pytest
      - name: Run tests
        run: |
          if [ -f tests/test_lambda.py ]; then pytest tests/ || echo "No tests to run"; fi

  deploy:
    name: Terraform Apply
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC
      contents: read    # Required for checkout
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::293280994842:role/doc-pipeline-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Lambda package
        run: |
          rm -rf terraform/build
          mkdir -p terraform/build
          pip install -r src/requirements.txt -t terraform/build
          cp src/lambda_function.py terraform/build/

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -no-color

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve